name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test -- default features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      # `crates/dae-runtime` resolves general-spice-core and general-mna as
      # *path* dependencies into sibling checkouts (`../../../spice-lsp`,
      # `../../../general-mna`), so a runner holding only this repository
      # cannot even run `cargo metadata` — `cargo fmt --all` failed with
      # "failed to load manifest for workspace member crates/dae-runtime"
      # before anything was built. Every job reproduces the local layout:
      #
      #   $GITHUB_WORKSPACE/general-simulator        <- this repository
      #   $GITHUB_WORKSPACE/spice-lsp                <- general-spice-core
      #   $GITHUB_WORKSPACE/general-mna              <- general-mna
      #   $GITHUB_WORKSPACE/gs-waveform-measurements <- the CLI's own path dep
      #
      # All are public, so the default GITHUB_TOKEN can read them.
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna

      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-simulator

      # crates/octave-ffi drives a real `octave-cli` subprocess rather than
      # linking Octave (see that crate's module doc comment on why: "mere
      # aggregation" under the GPL, not linking), and its tests say so in their
      # own expect() message -- "octave-cli must be on PATH for this test". The
      # runner image has no Octave, so without this every octave-ffi test fails
      # at spawn, in both jobs, with nothing to do with the change under test.
      - name: Install Octave (octave-cli, for crates/octave-ffi)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      # "Default features" means the CLI's own `python` feature is off, not that
      # no crate embeds Python: crates/pyblock-ffi builds and runs its own tests
      # either way, and they import numpy (an ndarray is how a vector signal
      # crosses that boundary). Pinned to the same 3.12 as the python-feature
      # job, for the same reason stated there, and so both jobs link PyO3
      # against the same interpreter rather than whatever the runner image
      # happens to ship.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy (for the kind=pyblock fixtures)
        run: python -m pip install --upgrade "numpy<3"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features -- no Python build dependency)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace --release -- --test-threads=1

      # Not -D warnings: several crates have pre-existing broken rustdoc intra-doc links (doc
      # comments cross-referencing symbols in a sibling crate, or private items) -- a real
      # cleanup, but out of scope for wiring up CI itself; docs.yml's own existing `cargo doc`
      # step (which actually publishes the docs site) already tolerates these the same way.
      # cargo doc still fails this step outright on a genuine doc-build error, just not warnings.
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  rust-python:
    name: Rust (clippy, test -- python feature, kind=pyblock/kind=pyfunc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      # `crates/dae-runtime` resolves general-spice-core and general-mna as
      # *path* dependencies into sibling checkouts (`../../../spice-lsp`,
      # `../../../general-mna`), so a runner holding only this repository
      # cannot even run `cargo metadata` — `cargo fmt --all` failed with
      # "failed to load manifest for workspace member crates/dae-runtime"
      # before anything was built. Every job reproduces the local layout:
      #
      #   $GITHUB_WORKSPACE/general-simulator        <- this repository
      #   $GITHUB_WORKSPACE/spice-lsp                <- general-spice-core
      #   $GITHUB_WORKSPACE/general-mna              <- general-mna
      #   $GITHUB_WORKSPACE/gs-waveform-measurements <- the CLI's own path dep
      #
      # All are public, so the default GITHUB_TOKEN can read them.
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna

      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-simulator

      # Pinned, not "3.x": that floats forward with each runner image and has
      # already outrun the pinned PyO3 — the build failed with "the configured
      # Python version (3.15) is newer than PyO3's maximum supported version
      # (3.14)". Raise this deliberately when PyO3 is upgraded.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # crates/octave-ffi drives a real `octave-cli` subprocess rather than
      # linking Octave (see that crate's module doc comment on why: "mere
      # aggregation" under the GPL, not linking), and its tests say so in their
      # own expect() message -- "octave-cli must be on PATH for this test". The
      # runner image has no Octave, so without this every octave-ffi test fails
      # at spawn, in both jobs, with nothing to do with the change under test.
      - name: Install Octave (octave-cli, for crates/octave-ffi)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      # kind=pyblock's own fixtures import numpy (an ndarray is how a vector
      # signal crosses the boundary), so the interpreter setup-python installs
      # is not enough on its own -- `ModuleNotFoundError: No module named
      # 'numpy'` inside the embedded interpreter, not a Rust failure.
      - name: Install numpy (for the kind=pyblock fixtures)
        run: python -m pip install --upgrade "numpy<3"

      - name: cargo clippy (python feature)
        run: cargo clippy --workspace --all-targets --features general-simulator-cli/python -- -D warnings

      - name: cargo test (python feature)
        run: cargo test --workspace --release --features general-simulator-cli/python -- --test-threads=1

      # `doc-verify` is the proof that every `## Example` and `## Errors` claim in
      # the Component Reference was run against the real CLI rather than written
      # from plausible-looking prose. It lives in this job because this is the one
      # that has what it needs: a CLI built with the `python` feature (six
      # pyblock/pyfunc cases fail with PythonSupportNotCompiledIn without it),
      # Octave for the octblock/octfunc folders, numpy, and the sibling checkouts.
      #
      # It builds the binary explicitly rather than relying on the test step above,
      # because `cargo test` does not guarantee the CLI binary itself is built.
      - name: build the CLI doc-verify subprocesses
        run: cargo build --release -p general-simulator-cli --features python

      - name: doc-verify (the documented examples still run)
        run: |
          python -m pip install --upgrade pytest
          python -m pytest doc-verify -q
