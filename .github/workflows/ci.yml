name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test -- default features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      # `crates/dae-runtime` resolves general-spice-core and general-mna as
      # *path* dependencies into sibling checkouts (`../../../spice-lsp`,
      # `../../../general-mna`), so a runner holding only this repository
      # cannot even run `cargo metadata` — `cargo fmt --all` failed with
      # "failed to load manifest for workspace member crates/dae-runtime"
      # before anything was built. Every job reproduces the local layout:
      #
      #   $GITHUB_WORKSPACE/general-simulator        <- this repository
      #   $GITHUB_WORKSPACE/spice-lsp                <- general-spice-core
      #   $GITHUB_WORKSPACE/general-mna              <- general-mna
      #   $GITHUB_WORKSPACE/gs-waveform-measurements <- the CLI's own path dep
      #
      # All are public, so the default GITHUB_TOKEN can read them.
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna

      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      # A change that moves a version across a repository boundary cannot be green in
      # either repository until it is green in both: this branch asks for a sibling
      # version that exists only on the sibling's own branch -- general-mna on its
      # default branch requires continuous-blocks ^0.5.0, say, while this workspace has
      # already moved to 0.6.0. So when a sibling carries a branch of this one's name,
      # test against that branch rather than its default branch; otherwise the two
      # repositories deadlock and neither side can go first.
      #
      # The resolution is **two-way** -- general-mna's CI checks this repository out the
      # same way -- so no push order satisfies both and the first-pushed branch of a
      # release pair always starts a run before its sibling exists. The script reports
      # which ref each sibling ended up on, matched or not, so that run's log says so.
      - name: Prefer sibling branches of the same name, when they exist
        shell: bash
        working-directory: ${{ github.workspace }}
        run: >-
          bash general-simulator/scripts/ci/prefer-sibling-branches.sh
          "${{ github.head_ref || github.ref_name }}"
          spice-lsp general-mna gs-waveform-measurements

      # Before cargo, so that the one failure a release pair really does produce --
      # the sibling's matching branch is not pushed yet, so its default branch was
      # checked out and declares an older version -- fails here, naming both
      # versions and the branch it expected, instead of in cargo's resolver naming a
      # requirement and a directory (general-simulator#142).
      - name: Check the sibling checkouts satisfy this workspace's requirements
        shell: bash
        working-directory: general-simulator
        run: >-
          bash scripts/ci/check-sibling-versions.sh
          "${{ github.head_ref || github.ref_name }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-simulator

      # crates/octave-ffi drives a real `octave-cli` subprocess rather than
      # linking Octave (see that crate's module doc comment on why: "mere
      # aggregation" under the GPL, not linking), and its tests say so in their
      # own expect() message -- "octave-cli must be on PATH for this test". The
      # runner image has no Octave, so without this every octave-ffi test fails
      # at spawn, in both jobs, with nothing to do with the change under test.
      - name: Install Octave (octave-cli, for crates/octave-ffi)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      # "Default features" means the CLI's own `python` feature is off, not that
      # no crate embeds Python: crates/pyblock-ffi builds and runs its own tests
      # either way, and they import numpy (an ndarray is how a vector signal
      # crosses that boundary). Pinned to the same 3.12 as the python-feature
      # job, for the same reason stated there, and so both jobs link PyO3
      # against the same interpreter rather than whatever the runner image
      # happens to ship.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy (for the kind=pyblock fixtures)
        run: python -m pip install --upgrade "numpy<3"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features -- no Python build dependency)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace --release -- --test-threads=1

      # Not -D warnings: several crates have pre-existing broken rustdoc intra-doc links (doc
      # comments cross-referencing symbols in a sibling crate, or private items) -- a real
      # cleanup, but out of scope for wiring up CI itself; docs.yml's own existing `cargo doc`
      # step (which actually publishes the docs site) already tolerates these the same way.
      # cargo doc still fails this step outright on a genuine doc-build error, just not warnings.
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  rust-python:
    name: Rust (clippy, test -- python feature, kind=pyblock/kind=pyfunc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      # `crates/dae-runtime` resolves general-spice-core and general-mna as
      # *path* dependencies into sibling checkouts (`../../../spice-lsp`,
      # `../../../general-mna`), so a runner holding only this repository
      # cannot even run `cargo metadata` — `cargo fmt --all` failed with
      # "failed to load manifest for workspace member crates/dae-runtime"
      # before anything was built. Every job reproduces the local layout:
      #
      #   $GITHUB_WORKSPACE/general-simulator        <- this repository
      #   $GITHUB_WORKSPACE/spice-lsp                <- general-spice-core
      #   $GITHUB_WORKSPACE/general-mna              <- general-mna
      #   $GITHUB_WORKSPACE/gs-waveform-measurements <- the CLI's own path dep
      #
      # All are public, so the default GITHUB_TOKEN can read them.
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna

      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      # A change that moves a version across a repository boundary cannot be green in
      # either repository until it is green in both: this branch asks for a sibling
      # version that exists only on the sibling's own branch -- general-mna on its
      # default branch requires continuous-blocks ^0.5.0, say, while this workspace has
      # already moved to 0.6.0. So when a sibling carries a branch of this one's name,
      # test against that branch rather than its default branch; otherwise the two
      # repositories deadlock and neither side can go first.
      #
      # The resolution is **two-way** -- general-mna's CI checks this repository out the
      # same way -- so no push order satisfies both and the first-pushed branch of a
      # release pair always starts a run before its sibling exists. The script reports
      # which ref each sibling ended up on, matched or not, so that run's log says so.
      - name: Prefer sibling branches of the same name, when they exist
        shell: bash
        working-directory: ${{ github.workspace }}
        run: >-
          bash general-simulator/scripts/ci/prefer-sibling-branches.sh
          "${{ github.head_ref || github.ref_name }}"
          spice-lsp general-mna gs-waveform-measurements

      # Before cargo, so that the one failure a release pair really does produce --
      # the sibling's matching branch is not pushed yet, so its default branch was
      # checked out and declares an older version -- fails here, naming both
      # versions and the branch it expected, instead of in cargo's resolver naming a
      # requirement and a directory (general-simulator#142).
      - name: Check the sibling checkouts satisfy this workspace's requirements
        shell: bash
        working-directory: general-simulator
        run: >-
          bash scripts/ci/check-sibling-versions.sh
          "${{ github.head_ref || github.ref_name }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-simulator

      # Pinned, not "3.x": that floats forward with each runner image and has
      # already outrun the pinned PyO3 — the build failed with "the configured
      # Python version (3.15) is newer than PyO3's maximum supported version
      # (3.14)". Raise this deliberately when PyO3 is upgraded.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # crates/octave-ffi drives a real `octave-cli` subprocess rather than
      # linking Octave (see that crate's module doc comment on why: "mere
      # aggregation" under the GPL, not linking), and its tests say so in their
      # own expect() message -- "octave-cli must be on PATH for this test". The
      # runner image has no Octave, so without this every octave-ffi test fails
      # at spawn, in both jobs, with nothing to do with the change under test.
      - name: Install Octave (octave-cli, for crates/octave-ffi)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      # kind=pyblock's own fixtures import numpy (an ndarray is how a vector
      # signal crosses the boundary), so the interpreter setup-python installs
      # is not enough on its own -- `ModuleNotFoundError: No module named
      # 'numpy'` inside the embedded interpreter, not a Rust failure.
      - name: Install numpy (for the kind=pyblock fixtures)
        run: python -m pip install --upgrade "numpy<3"

      - name: cargo clippy (python feature)
        run: cargo clippy --workspace --all-targets --features general-simulator-cli/python -- -D warnings

      - name: cargo test (python feature)
        run: cargo test --workspace --release --features general-simulator-cli/python -- --test-threads=1

      # `doc-verify` is the proof that every `## Example` and `## Errors` claim in
      # the Component Reference was run against the real CLI rather than written
      # from plausible-looking prose. It lives in this job because this is the one
      # that has what it needs: a CLI built with the `python` feature (six
      # pyblock/pyfunc cases fail with PythonSupportNotCompiledIn without it),
      # Octave for the octblock/octfunc folders, numpy, and the sibling checkouts.
      #
      # It builds the binary explicitly rather than relying on the test step above,
      # because `cargo test` does not guarantee the CLI binary itself is built.
      - name: build the CLI doc-verify subprocesses
        run: cargo build --release -p general-simulator-cli --features python

      - name: doc-verify (the documented examples still run)
        run: |
          python -m pip install --upgrade pytest
          python -m pytest doc-verify -q

  llms-fresh:
    # `book/llms.txt` and `book/llms-full.txt` are committed, and the docs workflow regenerates
    # them at publish time -- so the published copies were always current while the tracked ones
    # drifted for two months. That is worse than not committing them: a reader who opens the
    # file in the repository cannot tell it is stale. This job makes staleness a failing check
    # instead, which is the cheaper half of "untrack them or keep them current by a gate".
    name: Docs (llms.txt is current)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate and compare
        run: |
          python3 scripts/generate-llms-txt.py
          if ! git diff --quiet -- book/llms.txt book/llms-full.txt; then
            echo "::error::book/llms.txt or book/llms-full.txt is out of date."
            echo "Run 'python3 scripts/generate-llms-txt.py' and commit the result."
            git diff --stat -- book/llms.txt book/llms-full.txt
            exit 1
          fi
          echo "both files match their sources"

  windows-smoke:
    name: Windows (the released binary actually runs)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: general-simulator
    steps:
      # Same sibling layout every other job reproduces -- see the `rust` job's own
      # comment for why the path dependencies make it necessary.
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp
      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna
      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      # A change that moves a version across a repository boundary cannot be green in
      # either repository until it is green in both: this branch asks for a sibling
      # version that exists only on the sibling's own branch -- general-mna on its
      # default branch requires continuous-blocks ^0.5.0, say, while this workspace has
      # already moved to 0.6.0. So when a sibling carries a branch of this one's name,
      # test against that branch rather than its default branch; otherwise the two
      # repositories deadlock and neither side can go first.
      #
      # The resolution is **two-way** -- general-mna's CI checks this repository out the
      # same way -- so no push order satisfies both and the first-pushed branch of a
      # release pair always starts a run before its sibling exists. The script reports
      # which ref each sibling ended up on, matched or not, so that run's log says so.
      - name: Prefer sibling branches of the same name, when they exist
        shell: bash
        working-directory: ${{ github.workspace }}
        run: >-
          bash general-simulator/scripts/ci/prefer-sibling-branches.sh
          "${{ github.head_ref || github.ref_name }}"
          spice-lsp general-mna gs-waveform-measurements

      # Before cargo, so that the one failure a release pair really does produce --
      # the sibling's matching branch is not pushed yet, so its default branch was
      # checked out and declares an older version -- fails here, naming both
      # versions and the branch it expected, instead of in cargo's resolver naming a
      # requirement and a directory (general-simulator#142).
      - name: Check the sibling checkouts satisfy this workspace's requirements
        shell: bash
        working-directory: general-simulator
        run: >-
          bash scripts/ci/check-sibling-versions.sh
          "${{ github.head_ref || github.ref_name }}"

      - uses: dtolnay/rust-toolchain@stable

      # The default feature set, which is what `release.yml` ships: no libpython link,
      # so the artifact a user downloads needs nothing beyond itself.
      - name: build the CLI as the release does
        run: cargo build --release -p general-simulator-cli

      # Everything below is the Windows half of what the Linux jobs already prove. It
      # exists because two defects reached a release that only Windows could expose: the
      # archive contains `general-simulator.exe`, and a `--version` probe the CLI did not
      # answer. Both were found by reasoning rather than by running, which is exactly the
      # gap this job closes.
      - name: the binary is where the release archive takes it from
        run: test -f target/release/general-simulator.exe

      - name: --version answers on stdout with status 0
        run: |
          out="$(./target/release/general-simulator.exe --version)"
          echo "got: $out"
          case "$out" in
            "general-simulator "*) ;;
            *) echo "expected a 'general-simulator <version>' line"; exit 1 ;;
          esac

      - name: --help answers on stdout with status 0
        run: |
          ./target/release/general-simulator.exe --help > help.txt
          grep -q "USAGE" help.txt
          grep -q -- "--out-every" help.txt

      - name: a flag before the netlist names itself rather than a missing file
        run: |
          if ./target/release/general-simulator.exe --tfinal 1e-3 2> err.txt; then
            echo "expected a failing status"; exit 1
          fi
          cat err.txt
          grep -q "unrecognized argument '--tfinal'" err.txt
          grep -q "netlist path comes first" err.txt
          if grep -q "No such file or directory" err.txt; then
            echo "it must not blame a missing file"; exit 1
          fi

      # A real solve, so this job proves the binary works and not merely that it starts.
      # Same circuit as the CLI's own first fixture: 5 V across 1 k, so I(V1) = -5 mA.
      - name: a DC solve gives the hand-checked answer
        run: |
          printf 'V1 a 0 5\nR1 a 0 1000\n' > smoke.cir
          ./target/release/general-simulator.exe smoke.cir > smoke.csv
          cat smoke.csv
          grep -q "^t,V(a),I(V1)$" smoke.csv
          grep -q "^0,5,-0.005$" smoke.csv

      - name: a transient run writes the rows it should
        run: |
          printf 'V1 a 0 5\nR1 a m 1000\nC1 m 0 1e-6\n' > rc.cir
          ./target/release/general-simulator.exe rc.cir --mode transient --tfinal 1e-3 --dt 1e-5 > rc.csv
          rows="$(( $(wc -l < rc.csv) - 1 ))"
          echo "rows: $rows"
          test "$rows" -eq 100
