name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test -- default features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      # `crates/dae-runtime` resolves general-spice-core and general-mna as
      # *path* dependencies into sibling checkouts (`../../../spice-lsp`,
      # `../../../general-mna`), so a runner holding only this repository
      # cannot even run `cargo metadata` — `cargo fmt --all` failed with
      # "failed to load manifest for workspace member crates/dae-runtime"
      # before anything was built. Every job reproduces the local layout:
      #
      #   $GITHUB_WORKSPACE/general-simulator        <- this repository
      #   $GITHUB_WORKSPACE/spice-lsp                <- general-spice-core
      #   $GITHUB_WORKSPACE/general-mna              <- general-mna
      #   $GITHUB_WORKSPACE/gs-waveform-measurements <- the CLI's own path dep
      #
      # All are public, so the default GITHUB_TOKEN can read them.
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna

      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-simulator

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features -- no Python build dependency)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace --release -- --test-threads=1

      # Not -D warnings: several crates have pre-existing broken rustdoc intra-doc links (doc
      # comments cross-referencing symbols in a sibling crate, or private items) -- a real
      # cleanup, but out of scope for wiring up CI itself; docs.yml's own existing `cargo doc`
      # step (which actually publishes the docs site) already tolerates these the same way.
      # cargo doc still fails this step outright on a genuine doc-build error, just not warnings.
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  rust-python:
    name: Rust (clippy, test -- python feature, kind=pyblock/kind=pyfunc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general-simulator
    steps:
      - name: Check out general-simulator
        uses: actions/checkout@v4
        with:
          path: general-simulator

      # `crates/dae-runtime` resolves general-spice-core and general-mna as
      # *path* dependencies into sibling checkouts (`../../../spice-lsp`,
      # `../../../general-mna`), so a runner holding only this repository
      # cannot even run `cargo metadata` — `cargo fmt --all` failed with
      # "failed to load manifest for workspace member crates/dae-runtime"
      # before anything was built. Every job reproduces the local layout:
      #
      #   $GITHUB_WORKSPACE/general-simulator        <- this repository
      #   $GITHUB_WORKSPACE/spice-lsp                <- general-spice-core
      #   $GITHUB_WORKSPACE/general-mna              <- general-mna
      #   $GITHUB_WORKSPACE/gs-waveform-measurements <- the CLI's own path dep
      #
      # All are public, so the default GITHUB_TOKEN can read them.
      - name: Check out sibling spice-lsp (general-spice-core)
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/spice-lsp
          path: spice-lsp

      - name: Check out sibling general-mna
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/general-mna
          path: general-mna

      - name: Check out sibling gs-waveform-measurements
        uses: actions/checkout@v4
        with:
          repository: GLODI-Engineering/gs-waveform-measurements
          path: gs-waveform-measurements

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: general-simulator

      # Pinned, not "3.x": that floats forward with each runner image and has
      # already outrun the pinned PyO3 — the build failed with "the configured
      # Python version (3.15) is newer than PyO3's maximum supported version
      # (3.14)". Raise this deliberately when PyO3 is upgraded.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo clippy (python feature)
        run: cargo clippy --workspace --all-targets --features general-simulator-cli/python -- -D warnings

      - name: cargo test (python feature)
        run: cargo test --workspace --release --features general-simulator-cli/python -- --test-threads=1
