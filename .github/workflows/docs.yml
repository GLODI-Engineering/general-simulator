name: docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "crates/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook and mdbook-katex
        run: |
          cargo install mdbook --locked
          cargo install mdbook-katex --locked

      # Two packages beyond the obvious ones, each found by running the build
      # and reading what it asked for, and each located with `dpkg -S` rather
      # than inferred from a package name:
      #
      #   lmodern                    -> lmodern.sty, which pandoc's default
      #                                 LaTeX template loads unconditionally,
      #                                 before book/build-pdf.sh's own
      #                                 `-V mainfont="DejaVu Serif"` has any
      #                                 say. The DejaVu setup neither causes
      #                                 nor avoids it. The *fonts* in
      #                                 texlive-fonts-recommended are not this
      #                                 style file.
      #   texlive-fonts-recommended  -> pzdr.tfm (ZapfDingbats metrics), which
      #                                 hyperref's \XeTeXLink@font wants for
      #                                 link borders. Missing, xelatex tries to
      #                                 build it with metafont and dies.
      #
      # Neither arrives transitively under --no-install-recommends, which is
      # the flag's whole job. Together they were the entire reason the PDF step
      # failed on every push to main since 2026-09-22 -- and because this
      # workflow is `on: push` rather than a pull-request gate, the whole site
      # silently stopped publishing while every PR stayed green. See #25.
      - name: Install Pandoc, LaTeX (for PDFs), and DejaVu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra \
            lmodern texlive-fonts-recommended fonts-dejavu

      - name: Build user guide (HTML)
        run: mdbook build book/user-guide

      - name: Build dev guide (HTML)
        run: mdbook build book/dev-guide

      - name: Build PDFs
        run: |
          book/build-pdf.sh user-guide
          book/build-pdf.sh dev-guide

      - name: Generate llms.txt / llms-full.txt
        run: python3 scripts/generate-llms-txt.py

      - name: Build API reference (cargo doc)
        run: cargo doc --workspace --no-deps

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp book/index.html public/index.html
          cp -r book/images public/images
          cp -r book/user-guide/book public/user-guide
          cp -r book/dev-guide/book public/dev-guide
          cp -r target/doc public/api
          cp book/user-guide.pdf public/user-guide.pdf
          cp book/dev-guide.pdf public/dev-guide.pdf
          # llms.txt convention (https://llmstxt.org) expects these at the site root.
          cp book/llms.txt public/llms.txt
          cp book/llms-full.txt public/llms-full.txt
          # cargo doc has no index.html at the workspace root by default; redirect to a crate.
          if [ ! -f public/api/index.html ]; then
            printf '<meta http-equiv="refresh" content="0; url=dae_runtime/index.html">' \
              > public/api/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
