[book]
title = "general-simulator User Guide"
description = "Educational piecewise-linear circuit and block-diagram simulator: netlist grammar, block library, and worked examples."
authors = ["general-simulator contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/GLODI-Engineering/general-simulator"
edit-url-template = "https://github.com/GLODI-Engineering/general-simulator/edit/main/book/user-guide/{path}"
site-url = "/general-simulator/user-guide/"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.fold]
enable = true
level = 1

[preprocessor.katex]
after = ["links"]
