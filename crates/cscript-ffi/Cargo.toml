[package]
name = "cscript-ffi"
version = "0.3.1"
description = "Loads and calls user-supplied, dynamically-linked C blocks (Declarations/StartFcn/OutputFcn code slots, one instance's state per block) -- the one place in this workspace where unsafe FFI into arbitrary native code is deliberately allowed, kept isolated from every other crate."
edition.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cscript-ffi"
keywords = ["ffi", "simulation", "plugin"]
categories = ["simulation", "api-bindings"]

[dependencies]
libloading = "0.9"
