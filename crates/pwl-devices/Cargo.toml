[package]
name = "pwl-devices"
version = "0.3.0"
description = "Piecewise-linear device companion models (ideal diode, ideal switch) in Chua-Lin canonical form, for LCP-based mode selection instead of Newton-Raphson + voltage limiting."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pwl-devices"
keywords = ["spice", "diode", "mosfet", "circuit-simulation"]
categories = ["science", "simulation"]

[dependencies]
lcp-solver = { path = "../lcp-solver", version = "0.3.0" }
