[package]
name = "pyblock-ffi"
version = "0.3.0"
description = "Embeds a Python interpreter and calls user-supplied Python functions (start/output, optionally derivative/output_xc) once per resolved block-graph step -- the Python-hosted counterpart to cscript-ffi's dynamically-linked C blocks, kept isolated from every other crate."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pyblock-ffi"
keywords = ["ffi", "simulation", "python"]
categories = ["simulation", "api-bindings"]

[dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
numpy = "0.29"
