[package]
name = "elspice-pwl-cli"
version = "0.1.0"
description = "Thin runner for elspice-pwl: netlist + a small PWL-device params file in, a waveform CSV out."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "elspice-pwl"
path = "src/main.rs"

[dependencies]
dae-runtime = { path = "../dae-runtime" }
pwl-devices = { path = "../pwl-devices" }
spice-core = { path = "../../../spice-lsp/servers/core" }
