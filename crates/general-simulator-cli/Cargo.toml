[package]
name = "general-simulator-cli"
version = "0.3.0"
description = "Thin runner for general-simulator: netlist + a small PWL-device params file in, a waveform CSV out."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/general-simulator-cli"
keywords = ["circuit-simulation", "spice", "cli"]
categories = ["science", "simulation", "command-line-utilities"]

[[bin]]
name = "general-simulator"
path = "src/main.rs"

[features]
default = []
# Propagates dae-runtime's own optional pyo3-embedding feature -- kind=pyblock/kind=pyfunc
# netlist support needs a discoverable Python/libpython at build/link time; off by default so
# the plain `general-simulator` binary needs nothing beyond a Rust toolchain to build.
python = ["dae-runtime/python"]

[dependencies]
continuous-blocks = { path = "../continuous-blocks", version = "0.3.0" }
dae-runtime = { path = "../dae-runtime", version = "0.3.0" }
pwl-devices = { path = "../pwl-devices", version = "0.3.0" }
general-spice-core = { path = "../../../spice-lsp/servers/core", version = "0.1.0" }
general-mna = { path = "../../../general-mna", version = "0.1.0" }
gs-waveform-measurements = { path = "../../../gs-waveform-measurements", version = "0.1.0" }

[[test]]
name = "pyblock_cli"
path = "tests/pyblock_cli.rs"
required-features = ["python"]

[[test]]
name = "pyfunc_cli"
path = "tests/pyfunc_cli.rs"
required-features = ["python"]
