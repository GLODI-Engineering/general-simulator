[package]
name = "octave-ffi"
version = "0.2.0"
description = "Spawns and drives a persistent octave-cli subprocess to call user-supplied Octave-compatible .m functions once per resolved block-graph step -- the mere-aggregation counterpart to pyblock-ffi's embedded interpreter, kept isolated from every other crate. Never links against any Octave C/C++ library -- see the module doc comment for the licensing rationale."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/octave-ffi"
keywords = ["ffi", "simulation", "octave"]
categories = ["simulation", "api-bindings"]

[dependencies]
