[package]
name = "dae-runtime"
version = "0.4.0"
description = "Assembles a circuit's linear MNA system (via general-mna) with PWL device segments (via pwl-devices) into one LCP, solves it (via lcp-solver), and reports the resolved DC operating point -- no Newton-Raphson."
edition.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dae-runtime"
keywords = ["circuit-simulation", "dae", "spice"]
categories = ["science", "simulation"]

[features]
default = []
# pyblock-ffi embeds a Python interpreter (via pyo3), which needs a discoverable Python/libpython
# at build/link time -- opt-in, not required for the core simulator (kind=cscript covers the
# same "dynamically-loaded custom block" need without that build dependency). Mirrors
# general-mna's own `python` feature for its (unrelated) optional PyO3 bindings module.
python = ["dep:pyblock-ffi"]

[dependencies]
lcp-solver = { path = "../lcp-solver", version = "0.4.0" }
pwl-devices = { path = "../pwl-devices", version = "0.4.0" }
continuous-blocks = { path = "../continuous-blocks", version = "0.4.0" }
cscript-ffi = { path = "../cscript-ffi", version = "0.4.0" }
pyblock-ffi = { path = "../pyblock-ffi", version = "0.4.0", optional = true }
# octave-ffi is a pure-subprocess crate (spawns the separately-installed octave-cli binary --
# never links against any Octave library), so unlike pyblock-ffi it needs no special build-time
# dependency and no optional feature gate -- see octave_ffi's own module doc comment for the
# licensing rationale.
octave-ffi = { path = "../octave-ffi", version = "0.4.0" }
# Checkpoint/resume (see `checkpoint.rs`): a versioned binary snapshot of a run's whole
# loop-carried state. postcard because it is a compact, `f64`-bit-exact, no_std-friendly serde
# format with a stable wire encoding -- the file must round-trip every floating-point value
# exactly for a resumed run to be bit-identical to an uninterrupted one.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
# Cross-repo: general-spice-core lives in the separate spice-lsp repo, general-mna in its own.
# `path` keeps local builds working against the sibling checkouts already required today;
# `version` is what actually resolves once these are published, and is required for a `cargo
# publish` of dae-runtime itself to succeed at all (crates.io ignores `path`, needs `version`).
general-spice-core = { path = "../../../spice-lsp/servers/core", version = "0.1.0" }
general-mna = { path = "../../../general-mna", version = "0.2.0" }

[[test]]
name = "pyblock"
path = "tests/pyblock.rs"
required-features = ["python"]

[[test]]
name = "pyfunc"
path = "tests/pyfunc.rs"
required-features = ["python"]
