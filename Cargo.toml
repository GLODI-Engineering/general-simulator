[workspace]
resolver = "2"
members = [
    # gs-waveform-measurements was extracted to its own sibling repo
    # (../gs-waveform-measurements) for an independent release cadence and reuse beyond this
    # workspace, and is not itself a workspace member here (same convention general-mna's own
    # README documents) -- it is consumed as an ordinary sibling-path dependency, currently by
    # crates/general-simulator-cli alone, to evaluate `kind=measure` netlist lines as a
    # post-processing pass over a completed transient trace (see
    # crates/general-simulator-cli/src/measure.rs and book/dev-guide/src/measurements.md for why
    # this is a CLI-level concern, not a dae-runtime/general-mna block-graph one).
    "crates/lcp-solver",
    "crates/pwl-devices",
    "crates/dae-runtime",
    "crates/continuous-blocks",
    "crates/cscript-ffi",
    "crates/pyblock-ffi",
    "crates/general-simulator-cli",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
publish = true
repository = "https://github.com/Elvis-codeur/general-simulator"
homepage = "https://github.com/Elvis-codeur/general-simulator"
